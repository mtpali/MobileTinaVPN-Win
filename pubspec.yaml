name: mobiletina_vpn
description: MobileTinaVPN portable Windows client.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/connection/
  fonts:
    - family: MobileTina
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-UI-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-UI-Bold.ttf
          weight: 700
