analyzer:
  exclude:
    - build/**
    - windows/flutter/ephemeral/**
  errors:
    avoid_print: error
    dead_code: error
    unused_import: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - prefer_final_fields
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - use_build_context_synchronously
